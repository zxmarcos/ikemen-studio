# The whole package for Windows: the engine, the debugger and the screenpack, ready to run.
# Run it by hand (Actions > Build > Run workflow) and the package is among the run's artifacts; a
# tag v* also publishes it as a release. tools/debugger/scripts/sync_upstream.ps1 keeps this file.
name: Build

on:
  workflow_dispatch:
    inputs:
      screenpackBranch:
        description: Ikemen-GO-Screenpack branch to bundle
        default: master
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SCREENPACK_BRANCH: ${{ inputs.screenpackBranch || 'master' }}

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            diffutils
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libxmp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Build the engine and the debugger
        shell: 'msys2 {0}'
        env:
          BUILD_FFMPEG: "yes"
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
        run: |
          go mod download
          ./build/build.sh Win64
          tools/debugger/scripts/build.sh debugger

      - name: Put the package together
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SCREENPACK_BRANCH" --single-branch https://github.com/ikemen-engine/Ikemen-GO-Screenpack.git

          mkdir -p deploy/lib
          cp Ikemen_GO.exe deploy/
          cp -r lib/* deploy/lib/
          cp -r data font external \
                Ikemen-GO-Screenpack/chars \
                Ikemen-GO-Screenpack/data \
                Ikemen-GO-Screenpack/font \
                Ikemen-GO-Screenpack/sound \
                Ikemen-GO-Screenpack/stages \
                Ikemen-GO-Screenpack/video \
                deploy/
          cp src/resources/defaultMotif.ini deploy/data/system.base.def
          curl -fsSL "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/refs/heads/master/gamecontrollerdb.txt" \
               -o deploy/external/gamecontrollerdb.txt

          # The debugger finds Ikemen_GO.exe in its own folder; the mod goes next to it
          cp tools/debugger/build/ikemen-debugger.exe tools/debugger/build/ikdbg.lua deploy/
          cp README.md deploy/
          cp tools/debugger/README.md deploy/README-debugger.md

          section() { # title, then a file or a URL
            printf '\n==== %s ====\n\n' "$1"
            case "$2" in
              http*) curl -fsSL "$2" ;;
              *) cat "$2" ;;
            esac
            printf '\n'
          }
          {
            section "Ikemen GO (MIT)" LICENCE.txt
            section "Screenpack" Ikemen-GO-Screenpack/LICENCE.txt
            section "Dear ImGui" tools/debugger/third_party/imgui/LICENSE.txt
            section "LodePNG" tools/debugger/third_party/lodepng/LICENSE
            section "Font Awesome Free" tools/debugger/third_party/fontawesome/LICENSE.txt
            section "Roboto" tools/debugger/third_party/fonts/LICENSE-Roboto.txt
            section "JetBrains Mono" tools/debugger/third_party/fonts/LICENSE-JetBrainsMono.txt
            printf '\nFFmpeg is dynamically linked under the LGPL v2.1. Its exact source is src_ffmpeg.tar.gz, with this package.\n'
            section "FFmpeg (LGPL v2.1)" build/ffmpeg-src/COPYING.LGPLv2.1
            section "FFmpeg LICENSE.md" build/ffmpeg-src/LICENSE.md
            section "FFmpeg CREDITS" build/ffmpeg-src/CREDITS
            section "libvpx" build/libvpx-src/LICENSE
            section "SDL2" https://raw.githubusercontent.com/libsdl-org/SDL/main/LICENSE.txt
            section "libxmp" https://raw.githubusercontent.com/libxmp/libxmp/master/README
          } > deploy/LICENSES.txt

          # The exact FFmpeg source, as the LGPL asks of whoever passes the libraries on
          git config --global --add safe.directory '*'
          mkdir FFmpeg-CS
          git -C build/ffmpeg-src archive --format=tar HEAD | tar -x -C FFmpeg-CS
          cp build/ffmpeg-src/config.h build/ffmpeg-src/BUILDINFO.txt FFmpeg-CS/ 2>/dev/null || true
          tar -czf src_ffmpeg.tar.gz FFmpeg-CS

      - name: Keep the package with the run
        uses: actions/upload-artifact@v7
        with:
          name: ikemen-studio-windows
          path: deploy

      - name: Keep the FFmpeg source with the run
        uses: actions/upload-artifact@v7
        with:
          name: src_ffmpeg
          path: src_ffmpeg.tar.gz

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "ikemen-studio-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path deploy/* -DestinationPath $zip
          gh release create $env:GITHUB_REF_NAME $zip src_ffmpeg.tar.gz --generate-notes
